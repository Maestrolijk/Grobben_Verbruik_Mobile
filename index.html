<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#142D4E">
<link rel="icon" href="./icons/icon-192.png">
<title>Grobben Verbruik</title>
<link rel="stylesheet" href="./shinylive/style-resets.css">
<link rel="stylesheet" href="./shinylive/shinylive.css">
<script type="module" src="./shinylive/load-shinylive-sw.js"></script>
<script type="module" src="./unlock.js"></script>
<style>
body{margin:0;background:#f1f5f9;font:16px Arial,sans-serif;color:#142d4e} #gate{min-height:100dvh;display:grid;place-items:center;padding:20px;box-sizing:border-box} #gate[hidden],#root[hidden],#lock[hidden]{display:none} form{width:min(100%,390px);box-sizing:border-box;padding:28px;border-radius:18px;background:white;box-shadow:0 10px 40px #142d4e15} h1{margin:0 0 8px;font-size:26px} p{line-height:1.5} label{display:block;font-weight:bold;margin:20px 0 8px} input,button{box-sizing:border-box;width:100%;font:inherit;padding:13px;border-radius:8px;border:1px solid #a5b8ae} button{background:#142d4e;color:white;border:0;margin-top:12px;cursor:pointer} button:disabled{opacity:.5} #status{min-height:24px;color:#526c64;font-size:14px} #lock{position:fixed;bottom:12px;right:12px;z-index:1000;width:auto;padding:10px 16px;box-shadow:0 2px 12px #0003} #root{height:100vh;height:100dvh;width:100%}

/* Vergrendelen blijft beschikbaar in portrait. */
@media (orientation: landscape) { #lock { display:none !important; } }
</style>
</head>
<body>
<section id="gate"><form id="unlock"><h1>Grobben Verbruik</h1><p>Energie en water · Alleen inzage</p><label for="password">Wachtwoord</label><input id="password" type="password" required autocomplete="off" autocapitalize="none" spellcheck="false"><button id="submit" type="submit">Ontgrendelen</button><p id="status" role="status" aria-live="polite">Je gegevens worden lokaal ontsleuteld.</p></form></section>
<div id="root" hidden></div><button id="lock" hidden>Vergrendelen</button>
</body></html>
